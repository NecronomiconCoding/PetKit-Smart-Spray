probe:
  name: Probe (diagnostics)
  description: Run raw protocol commands on one Bluetooth connection and return the replies.
  fields:
    address:
      name: Bluetooth address
      required: true
      example: "A4:C1:38:10:5A:6F"
      selector:
        text:
    steps:
      name: Steps
      description: List of {cmd, data (hex), wait (s), read (bool)}.
      required: true
      selector:
        object:
